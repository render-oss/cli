version: "2"

linters:
  default: standard
  enable:
    - exhaustive
    - forbidigo
  settings:
    exhaustive:
      # Only switches annotated with an //exhaustive:enforce comment are
      # checked. A default arm does not satisfy the check, so an enforced
      # switch flags any enum constant it does not name explicitly.
      explicit-exhaustive-switch: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.Exit$
          pkg: ^os$
          msg: os.Exit is only allowed in main.go
        - pattern: ^log\.Fatal(f|ln)?$
          pkg: ^log$
          msg: log.Fatal is forbidden; return an error to the global executor
        - pattern: ^tea\.(WithAltScreen|EnterAltScreen|Program\.EnterAltScreen)$
          pkg: ^github\.com/charmbracelet/bubbletea$
          msg: full-screen Bubble Tea programs must launch through runFullScreenTUI
  exclusions:
    rules:
      - path: ^main\.go$
        text: os.Exit is only allowed in main.go
        linters:
          - forbidigo
      - path: ^tools/
        linters:
          - forbidigo
      - path: ^cmd/fullscreen\.go$
        text: full-screen Bubble Tea programs must launch through runFullScreenTUI
        linters:
          - forbidigo
      - path: _test\.go$
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt

issues:
  exclude-dirs:
    - e2e
