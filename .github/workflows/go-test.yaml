name: Go Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Go Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: 1.27
          cache: true

      - name: Test with the Go CLI
        run: go test ./cmd/... ./pkg/... ./internal/...

  # Stable status check for branch rules. The matrix above expands into one
  # context per OS, so requiring it directly means naming every leg and quietly
  # losing the requirement whenever a runner is renamed. Require this instead.
  required:
    name: Go Tests Required Checks
    needs: [test]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}  # Run even if the matrix fails. We don't use `always` because that can hang.
    steps:
      - name: Check matrix result
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" && "$TEST_RESULT" != "skipped" ]]; then
            echo "Run Go Tests result: $TEST_RESULT"
            exit 1
          fi
          echo "Run Go Tests result: $TEST_RESULT"
